34AB7;#1D9E75;#D85A30;#D4537E;#378ADD;#BA7517;#534AB7" dur="3s" repeatCount="indefinite" begin="1.80s"/>k</tspan><tspan><animate attributeName="fill" values="#534AB7;#1D9E75;#D85A30;#D4537E;#378ADD;#BA7517;#534AB7" dur="3s" repeatCount="indefinite" begin="1.95s"/>s</tspan><tspan><animate attributeName="fill" values="#534AB7;#1D9E75;#D85A30;#D4537E;#378ADD;#BA7517;#534AB7" dur="3s" repeatCount="indefinite" begin="2.10s"/>!</tspan>
